[package]
name = "toolbox"
version = "0.4.0"
edition = "2024"
description = "A CLI your AI can keep extending: Lua commands and a key vault"
license = "MIT"
repository = "https://github.com/WilliamThogersen/toolbox"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "string"] }
dirs = "7"
hmac = "0.13"
keyring = "4"
libc = "0.2.191"
mlua = { version = "0.12", features = ["lua55", "vendored", "serde", "anyhow"] }
percent-encoding = "2"
rpassword = "7"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3.27.0"
ureq = "3"
url = "2"
