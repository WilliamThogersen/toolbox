[package]
name = "toolbox"
version = "0.1.0"
edition = "2024"
description = "A CLI your AI can keep extending: Lua commands and a key vault"
license = "MIT"
repository = "https://github.com/WilliamThogersen/toolbox"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "string"] }
dirs = "7"
keyring = "4"
mlua = { version = "0.12", features = ["lua54", "vendored", "serde", "anyhow"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
url = "2"

[dev-dependencies]
libc = "0.2.191"
tempfile = "3.27.0"
