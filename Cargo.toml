[package]
name = "toolbox"
version = "0.10.0"
edition = "2024"
description = "A CLI your AI can keep extending: Lua commands and a key vault"
license = "MIT"
repository = "https://github.com/WilliamThogersen/toolbox"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "string"] }
dirs = "7"
hmac = "0.13"
libc = "0.2.191"
mlua = { version = "0.12", features = ["lua55", "vendored", "serde", "anyhow"] }
percent-encoding = "2"
ring = "0.17"
rpassword = "7"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
tempfile = "3.27.0"
ureq = "3"
url = "2"

# toolbox runs on macOS only. These stay macOS-gated so a build elsewhere reaches the clear
# `compile_error!` in src/sys/mod.rs instead of failing inside a dependency.
# `v1` picks the Keychain and never falls back to another store.
# The objc2 crates reach LocalAuthentication, for the Touch ID check before every vault change.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
keyring = { version = "4", default-features = false, features = ["v1"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext"] }

# Arithmetic that overflows stops the run with an error instead of wrapping to a wrong value.
[profile.release]
overflow-checks = true

# Lint levels for every target. CI turns warnings into errors. The rules behind them are in
# docs/code-rules.md; clippy.toml holds the thresholds.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Its fix, `assert_eq!(x, [] as [T; 0])`, reads worse than `assert!(x.is_empty())`.
assert_is_empty = "allow"
allow_attributes_without_reason = "warn"
exit = "warn"
expect_used = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"
