# Tests and lints every push to main and every pull request, on macOS and Linux.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the version. The runners' rustup uses the minimal
      # profile, so the pinned toolchain arrives without clippy.
      - name: Install the pinned Rust toolchain
        run: |
          cargo --version
          rustup component add clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore main's cache but don't save their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
