# Checks dependencies (deny.toml): security advisories, licenses, sources. Runs on every push to main,
# every pull request, and daily, since new advisories appear without any change here.
name: deny

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deny-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    strategy:
      fail-fast: false
      matrix:
        # One run per shipped platform: a crate pulled in only for another platform is never built.
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --target ${{ matrix.target }}
