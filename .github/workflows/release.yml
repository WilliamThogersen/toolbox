# Runs when a version tag is pushed: git tag -a v0.2.0 -F notes.md && git push origin v0.2.0
# Tests, builds a signed macOS binary and static Linux binaries (x86_64 and arm64), publishes
# a GitHub release with all three and updates the Homebrew formula in
# WilliamThogersen/homebrew-tap. The annotated tag's message becomes the release notes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml. Bump Cargo.toml, commit, then tag again."
            exit 1
          fi

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo installs the toolchain pinned in rust-toolchain.toml, then rustup adds targets to it.
      - name: Install Rust targets
        run: |
          cargo --version
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --locked

      - name: Build, sign and package
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir build dist
          # One universal binary, so the formula has a single url for Apple Silicon and Intel.
          lipo -create -output build/toolbox target/{aarch64,x86_64}-apple-darwin/release/toolbox
          # Hardened runtime: DYLD_* injection and debuggers can't get inside the process that reads the vault.
          codesign --force --sign - --options runtime build/toolbox
          for arch in arm64 x86_64; do
            info=$(codesign --display --verbose --arch "$arch" build/toolbox 2>&1)
            if [[ ! $info =~ flags=[^[:space:]]*runtime ]]; then
              echo "::error::hardened runtime is not set on the $arch slice"
              exit 1
            fi
          done
          build/toolbox --version
          tar -czf dist/toolbox-macos.tar.gz -C build toolbox

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolbox-macos
          path: dist/toolbox-macos.tar.gz
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    # Native runners for each architecture: no cross-compiling, and the tests run on the real thing.
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # musl gives one static binary: it runs on any distribution, whatever its glibc version.
      - name: Install the musl target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo --version
          rustup target add "$TARGET"

      - name: Test
        run: cargo test --locked --target "$TARGET"

      - name: Build and package
        run: |
          cargo build --release --locked --target "$TARGET"
          mkdir build dist
          cp "target/$TARGET/release/toolbox" build/toolbox
          if readelf --program-headers build/toolbox | grep -q INTERP; then
            echo "::error::the binary is dynamically linked"
            exit 1
          fi
          build/toolbox --version
          tar -czf "dist/toolbox-linux-${{ matrix.arch }}.tar.gz" -C build toolbox

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolbox-linux-${{ matrix.arch }}
          path: dist/toolbox-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: toolbox-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          for asset in toolbox-macos toolbox-linux-x86_64 toolbox-linux-arm64; do
            if [[ ! -f "dist/$asset.tar.gz" ]]; then
              echo "::error::dist/$asset.tar.gz is missing"
              exit 1
            fi
          done
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout can leave a lightweight copy of the tag; fetch the annotated one for its message.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag

      - name: Check out the Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WilliamThogersen/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha() { sha256sum "dist/$1.tar.gz" | cut -d ' ' -f 1; }
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/$version/g" \
              -e "s/@SHA256_MACOS@/$(sha toolbox-macos)/g" \
              -e "s/@SHA256_LINUX_ARM64@/$(sha toolbox-linux-arm64)/g" \
              -e "s/@SHA256_LINUX_X86_64@/$(sha toolbox-linux-x86_64)/g" \
              .github/homebrew/toolbox.rb > tap/Formula/toolbox.rb
          if grep -n '@[A-Z0-9_]*@' tap/Formula/toolbox.rb; then
            echo "::error::the formula still has a placeholder"
            exit 1
          fi
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/toolbox.rb
          git commit -m "toolbox $version"
          git push
